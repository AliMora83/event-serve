# Events Serve — build and deploy to Afrihost shared cPanel over FTPS.
#
# MANUAL TRIGGER ONLY. There is deliberately no `push:` trigger.
#
# eventsserve.co.za is LIVE and is the client's only web presence. There is no
# staging subdomain. The first deploy to public_html REPLACES the existing
# site, so deploying must be a decision someone makes, never a side effect of
# merging to main. Do not add a push trigger without changing that fact first.
#
# Until cutover day, use the `deploytest` target. It writes to a subdirectory
# and cannot touch the live site.
#
# TRANSPORT: FTPS, not SSH.
#
# SSH IS NOT AVAILABLE ON THIS HOSTING PACKAGE. Every SSH port times out while
# cPanel answers on 2083. This is a property of the Afrihost shared package,
# not a misconfiguration — do not spend another afternoon on it, and do not
# "restore" the rsync-over-SSH version of this file. The site is a static
# dist/ build; it never needed a shell.
#
# Because the target is now an FTP directory rather than an absolute
# filesystem path, DEPLOYTEST_PATH and PROD_PATH are retired and replaced by
# FTP_DEPLOYTEST_DIR and FTP_PROD_DIR, which are relative to the FTP account's
# root. See PROJECT.md for how to confirm what that root actually is.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'deploytest = pre-cutover test | cleanup-deploytest = remove it | production = REPLACES THE LIVE SITE'
        required: true
        default: deploytest
        type: choice
        options: [deploytest, cleanup-deploytest, production]
      confirm:
        description: 'For production ONLY: type REPLACE-LIVE-SITE to confirm'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}

    steps:
      # A live-site replacement should take more than one dropdown. This costs
      # nothing and makes an accidental production run essentially impossible.
      - name: Confirm production intent
        if: github.event.inputs.target == 'production'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "REPLACE-LIVE-SITE" ]; then
            echo "::error::Production deploy REPLACES the live eventsserve.co.za."
            echo "::error::Re-run with confirm = REPLACE-LIVE-SITE if that is intended."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: github.event.inputs.target != 'cleanup-deploytest'

      - uses: actions/setup-node@v4
        if: github.event.inputs.target != 'cleanup-deploytest'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: github.event.inputs.target != 'cleanup-deploytest'

      # DEPLOY_ENV=production is what makes the key mandatory. deploytest builds
      # keyless on purpose: it proves the transport and the .htaccess rules, and
      # does not need a working form. See src/components/ContactForm.astro.
      - name: Build
        if: github.event.inputs.target != 'cleanup-deploytest'
        env:
          DEPLOY_ENV: ${{ github.event.inputs.target }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
        run: npm run build

      # The deployed .htaccess already blocks /_deploytest/ via a REQUEST_URI
      # rewrite. Appending `Require all denied` is the second mechanism:
      # independent of mod_rewrite, and scoped to this directory only.
      #
      # Under SSH this was appended to the remote file after upload. FTP has no
      # remote shell, so the append happens here, to the build output, before
      # upload. Same two mechanisms, same result on the server. It is written
      # into dist/ in CI and is never committed — public/.htaccess in the repo
      # does not contain it, and a production build never runs this step.
      - name: Seal the deploy test directory
        if: github.event.inputs.target == 'deploytest'
        run: |
          set -euo pipefail
          printf '\n# Appended by the deploy workflow. This directory is not public.\nRequire all denied\n' >> dist/.htaccess
          echo "Sealed dist/.htaccess before upload"

      - name: Resolve target
        id: target
        env:
          TARGET: ${{ github.event.inputs.target }}
          FTP_PROD_DIR: ${{ vars.FTP_PROD_DIR }}
          FTP_DEPLOYTEST_DIR: ${{ vars.FTP_DEPLOYTEST_DIR }}
          PROD_URL: ${{ vars.PROD_URL }}
          DEPLOYTEST_URL: ${{ vars.DEPLOYTEST_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            dir="$FTP_PROD_DIR"
            url="$PROD_URL"
          else
            # deploytest and cleanup-deploytest share the same directory.
            dir="$FTP_DEPLOYTEST_DIR"
            url="$DEPLOYTEST_URL"
          fi

          # A clean-slate sync against a wrong or empty directory is
          # destructive, exactly as rsync --delete was.
          #
          # Normalise trailing slashes FIRST. Without this, a pattern meant to
          # catch a bare root also matches any legitimate deeper path written
          # with a trailing slash — which FTP targets always are, because the
          # action requires one.
          dir="${dir%/}"

          # These guards are the SSH-era checks rebased into FTP terms. The
          # old rules were "must be absolute" and "must contain at least three
          # slashes", both of which described an absolute filesystem path like
          # /home/<user>/public_html. An FTP directory is relative to the FTP
          # account root, so the equivalent assertions are: non-empty, NOT
          # absolute, no parent traversal, and at least one real segment.
          case "$dir" in
            ''|'.'|'./') echo "::error::Refusing to deploy to the FTP root ('$dir')"; exit 1 ;;
            /*) echo "::error::FTP dir must be relative to the FTP root, got absolute '$dir'"; exit 1 ;;
            *..*) echo "::error::FTP dir must not contain '..', got '$dir'"; exit 1 ;;
          esac

          # Belt and braces: the deploytest directory must be a subdirectory, so
          # a mis-set variable cannot aim the test run at the live document
          # root. Applies to cleanup too — a clean-slate wipe must not be
          # aimable at the document root by editing one repo variable.
          #
          # The */_deploytest pattern also enforces the "at least one segment"
          # rule for these two targets: it cannot match a bare '_deploytest'
          # sitting at the FTP root.
          if [ "$TARGET" != "production" ]; then
            case "$dir" in
              */_deploytest) ;;
              *) echo "::error::deploytest dir must end in /_deploytest, got '$dir'"; exit 1 ;;
            esac
          fi

          # SamKirkland/FTP-Deploy-Action requires a trailing slash on
          # server-dir. Emit both forms: the bare one for the guards and for
          # lftp, the slashed one for the action.
          echo "dir=$dir"             >> "$GITHUB_OUTPUT"
          echo "server_dir=$dir/"     >> "$GITHUB_OUTPUT"
          echo "url=$url"             >> "$GITHUB_OUTPUT"

      # The action keeps a sync-state file (.ftp-deploy-sync-state.json) in
      # server-dir and uses it to upload only what changed. Deleting it from
      # the server is not dangerous, but it does force a full re-upload of the
      # entire site on the next run.
      #
      # dangerous-clean-slate is deliberately NOT set here. On production it
      # would delete every file in public_html before uploading, including the
      # cPanel-owned entries excluded below.
      #
      # The excludes carry over from the rsync version: .well-known must
      # survive or AutoSSL renewal breaks, cgi-bin upsets the panel, and
      # _deploytest is excluded so a production run does not sweep away a test
      # directory that is still being inspected.
      - name: Deploy over FTPS
        if: github.event.inputs.target != 'cleanup-deploytest'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.target.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/cgi-bin/**
            **/.htpasswd
            **/_deploytest/**

      # ----------------------------------------------------------------------
      # Verification — deploytest
      #
      # The directory is deliberately unreachable, so a 200 is impossible and a
      # 403 is the only meaningful HTTP signal. What this test exists to prove
      # is that the transport works and the paths are right, which is why the
      # substantive checks read the remote filesystem rather than fetching it.
      #
      # Under SSH that was a `find` over the wire. lftp gives the same recursive
      # listing over FTPS, so file-count parity and the key-file assertion both
      # survive intact.
      #
      # The permission audit does NOT survive. FTP directory listings do not
      # report modes reliably across servers — LIST output is a de facto
      # convention, not a spec, and cPanel's FTP daemon is not obliged to give
      # us anything comparable to `find -perm`. Rather than assert something we
      # cannot trust, the check is dropped. If file modes are ever in question,
      # check them in cPanel's File Manager.
      # ----------------------------------------------------------------------
      - name: Install lftp
        if: github.event.inputs.target == 'deploytest'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --version | head -1

      - name: Verify over FTPS
        if: github.event.inputs.target == 'deploytest'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ steps.target.outputs.dir }}
          BASE: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail

          # Explicit TLS (AUTH TLS on port 21), matching the action's
          # `protocol: ftps`. lftp's ftps:// scheme would mean IMPLICIT TLS on
          # 990, which is a different thing — hence ftp:// plus ssl-force.
          #
          # Certificate verification stays ON. If this step fails on the
          # certificate, fix the certificate or pin the CA; do not add
          # `set ssl:verify-certificate no`.
          #
          # --env-password reads LFTP_PASSWORD from the environment so the
          # password never appears in the process arguments.
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" -e "
            set ssl:verify-certificate yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            cd \"$DIR\";
            find .;
            bye
          " > /tmp/remote_raw.txt

          # Normalise './x' -> 'x', drop directories (trailing /) and blanks.
          sed 's|^\./||' /tmp/remote_raw.txt | grep -v '/$' | grep . > /tmp/remote_files.txt || true

          if [ ! -s /tmp/remote_files.txt ]; then
            echo "::error::Remote listing of '$DIR' is empty — the upload did not land where expected"
            exit 1
          fi

          echo "--- file count: local build vs remote ---"
          local_n=$(find dist -type f | wc -l | tr -d ' ')
          # The action writes its own sync-state file into server-dir. It is
          # not part of the build, so it is excluded from the comparison.
          remote_n=$(grep -vc '^\.ftp-deploy-sync-state\.json$' /tmp/remote_files.txt || true)
          echo "  local  $local_n"
          echo "  remote $remote_n (excluding the sync-state file)"
          # The .htaccess seal is appended before upload, so it edits a file
          # and adds none. Remote is local + 0.
          [ "$local_n" = "$remote_n" ] || { echo "::error::file count mismatch"; exit 1; }

          echo "--- key files present ---"
          for f in index.html .htaccess robots.txt 404.html about/index.html contact/index.html partnerships/index.html; do
            if grep -Fxq "$f" /tmp/remote_files.txt; then echo "  ok      $f"; else echo "  MISSING $f"; exit 1; fi
          done

          echo "--- permissions ---"
          echo "  skipped: FTP cannot report file modes reliably. Check in cPanel File Manager if needed."

          echo "--- sample listing ---"
          head -15 /tmp/remote_files.txt | sed 's/^/    /'

          echo "--- the block actually blocks ---"
          if [ -n "${BASE:-}" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$BASE/")
            echo "  GET $BASE/ -> $code (expect 403)"
            case "$code" in
              403) echo "  ok: directory is not publicly fetchable" ;;
              200) echo "::error::_deploytest is PUBLICLY READABLE — a duplicate of the site is live"; exit 1 ;;
              *)   echo "::warning::unexpected status $code; not 200, so not publicly readable, but check the server config" ;;
            esac
          else
            echo "::warning::DEPLOYTEST_URL not set; cannot confirm the block from outside"
          fi

          echo
          echo "Transport proven. Run this workflow again with target"
          echo "cleanup-deploytest once you are satisfied — the directory should"
          echo "not sit on the live domain for weeks."

      # Production only. These assertions need a publicly fetchable URL, which
      # by design the deploy test does not have, so they run for the first time
      # at cutover.
      - name: Verify over HTTP
        if: github.event.inputs.target == 'production'
        env:
          BASE: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "::error::PROD_URL is not set"; exit 1
          fi
          fail=0

          echo "--- routes ---"
          for p in / /about /partnerships /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$BASE$p")
            printf '%-16s %s\n' "$p" "$code"
            [ "$code" = "200" ] || fail=1
          done

          echo "--- .htaccess applied? ---"
          hdrs=$(curl -sSI -L "$BASE/" | tr 'A-Z' 'a-z')
          for h in "x-content-type-options: nosniff" "referrer-policy: strict-origin-when-cross-origin"; do
            if printf '%s' "$hdrs" | grep -q "$h"; then echo "  ok      $h"; else echo "  MISSING $h"; fail=1; fi
          done

          asset=$(curl -s -L "$BASE/" | grep -o '/_astro/[A-Za-z0-9._-]*\.css' | head -1)
          if [ -n "$asset" ]; then
            cc=$(curl -sSI -L "$BASE$asset" | tr 'A-Z' 'a-z' | grep -i '^cache-control' || true)
            echo "  asset   $asset -> ${cc:-<none>}"
            printf '%s' "$cc" | grep -q immutable || { echo "::error::hashed asset not immutable"; fail=1; }
          fi

          echo "--- 404 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$BASE/definitely-not-a-page")
          echo "  $code (expect 404)"
          [ "$code" = "404" ] || fail=1

          exit $fail

      # ----------------------------------------------------------------------
      # Cleanup — _deploytest must not outlive the test it exists for.
      #
      # FTP-Deploy-Action cannot delete a remote directory. The equivalent is a
      # sync of an EMPTY local directory with dangerous-clean-slate, which
      # deletes every remote file in server-dir (including the sync-state file)
      # and uploads nothing.
      #
      # The directory itself survives, empty. That is acceptable: the
      # RewriteCond in public/.htaccess returns 403 for any /_deploytest URL
      # whether or not anything is inside it.
      # ----------------------------------------------------------------------

      # THIS CHECK MUST STAY IN ITS OWN STEP, BEFORE THE ACTION RUNS.
      #
      # The Resolve target step has already proven the suffix, and this repeats
      # it immediately before the only step in this workflow that can destroy
      # data. It is deliberately redundant. Do not fold it into the action's
      # inputs or into the step below — a guard that runs inside the thing it
      # is guarding is not a guard.
      - name: Pre-flight — refuse to wipe anything but _deploytest
        if: github.event.inputs.target == 'cleanup-deploytest'
        env:
          DIR: ${{ steps.target.outputs.dir }}
        run: |
          set -euo pipefail
          case "$DIR" in
            */_deploytest) ;;
            *) echo "::error::REFUSING clean-slate wipe of '$DIR' — it does not end in /_deploytest"; exit 1 ;;
          esac
          case "$DIR" in
            /*|*..*) echo "::error::REFUSING clean-slate wipe of '$DIR' — absolute or traversing"; exit 1 ;;
          esac
          echo "Pre-flight ok. Clean-slate wipe is scoped to: $DIR/"

      - name: Prepare an empty directory to sync
        if: github.event.inputs.target == 'cleanup-deploytest'
        run: |
          set -euo pipefail
          rm -rf ./.empty-clean-slate
          mkdir -p ./.empty-clean-slate
          echo "Prepared an empty local directory."

      - name: Wipe the deploy test directory over FTPS
        if: github.event.inputs.target == 'cleanup-deploytest'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./.empty-clean-slate/
          server-dir: ${{ steps.target.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          # The one place this is used. Scoped by the pre-flight step above.
          dangerous-clean-slate: true
          log-level: standard

      - name: Confirm the wipe
        if: github.event.inputs.target == 'cleanup-deploytest'
        run: echo "Deploy test directory emptied. It remains as an empty directory, still 403 via the parent .htaccess."
